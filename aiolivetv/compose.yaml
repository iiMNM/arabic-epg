# AIOLiveTV — self-hosted (نسخة خاصة فيك بدل baby-beamup)
# التشغيل:  cp .env.sample .env  ثم عدّل .env  ثم:  docker compose up -d
services:
  aiolivetv:
    # صورة جاهزة من المطوّر (مصدر مفتوح AGPL-3.0: github.com/mrcanelas/aiolivetv)
    # تقدر تثبّت إصدار معيّن بدل latest، مثلاً :v1.9.0
    image: ghcr.io/mrcanelas/aiolivetv:latest
    container_name: aiolivetv
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URI=sqlite://./data/db.sqlite
    volumes:
      - ./data:/app/data
    # مفتوح على 127.0.0.1 فقط؛ Caddy هو اللي يطلعه للإنترنت بـ HTTPS
    ports:
      - "127.0.0.1:3000:3000"

  # HTTPS تلقائي (Stremio ما يقبل إضافة بعيدة بدون https)
  caddy:
    image: caddy:2
    container_name: aiolivetv-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    command: caddy reverse-proxy --from ${DOMAIN} --to aiolivetv:3000
    volumes:
      - ./caddy:/data
    depends_on:
      - aiolivetv
